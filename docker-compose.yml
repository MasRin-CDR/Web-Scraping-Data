version: "3.9"

services:
  scraper:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: mahkamah_scraper
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - HEADLESS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s