# ============================================================
# docker-compose.yml — Mahkamah Agung Scraper Stack
# ============================================================

version: "3.9"

services:
  scraper-api:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: mahkamah-scraper-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./BACKEND/data:/app/data
      - ./BACKEND/logs:/app/logs
      - ./FRONTEND:/app/frontend
    env_file:
      - .env
    environment:
      - HEADLESS=true
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
        reservations:
          memory: 512M
          cpus: "0.5"
